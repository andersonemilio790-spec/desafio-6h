<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CHRONO 6H — Desafio 5.000 Kz</title>
  <link href="https://googleapis.com" rel="stylesheet">
  <style>
    :root {
      --bg-base: #05080f;
      --glass-bg: rgba(17, 25, 40, 0.75);
      --glass-border: rgba(255, 255, 255, 0.1);
      --cyan: #00f5d4;
      --blue-glow: #00bbf9;
      --gold: #ffd166;
      --red: #ff2a5f;
      --green: #06d6a0;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    
    body {
      background-color: var(--bg-base);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(0, 245, 212, 0.14) 0%, transparent 55%),
        radial-gradient(circle at 85% 90%, rgba(0, 187, 249, 0.1) 0%, transparent 45%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      text-align: center;
      user-select: none;
      overflow-x: hidden;
      transition: background 0.25s ease;
    }

    /* MODO ECRÃ PRETO ABSOLUTO QUANDO QUEBRA A ORDEM */
    body.modo-preto-aviso {
      background: #000000 !important;
      padding: 0;
    }

    .glass-card {
      width: 100%;
      max-width: 410px;
      background: var(--glass-bg);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--glass-border);
      border-radius: 28px;
      padding: 32px 24px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.12);
      animation: fadeIn 0.5s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .premio-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: linear-gradient(135deg, rgba(6, 214, 160, 0.18), rgba(0, 187, 249, 0.18));
      border: 1px solid rgba(6, 214, 160, 0.45);
      color: var(--cyan);
      font-weight: 800;
      font-size: 0.8rem;
      letter-spacing: 0.8px;
      padding: 7px 16px;
      border-radius: 999px;
      margin-bottom: 18px;
      box-shadow: 0 0 20px rgba(0, 245, 212, 0.15);
    }

    .status-bar {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .dot-live {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 10px var(--gold);
      animation: blink 1.2s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.8); }
    }

    .ring-wrapper {
      position: relative;
      width: 240px;
      height: 240px;
      margin: 0 auto 24px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .ring-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 240px;
      height: 240px;
      transform: rotate(-90deg);
    }

    .ring-bg {
      fill: none;
      stroke: rgba(255, 255, 255, 0.06);
      stroke-width: 8;
    }

    .ring-progress {
      fill: none;
      stroke: url(#neonGrad);
      stroke-width: 8;
      stroke-linecap: round;
      stroke-dasharray: 678;
      stroke-dashoffset: 0;
      transition: stroke-dashoffset 1s linear;
      filter: drop-shadow(0 0 8px rgba(0, 245, 212, 0.5));
    }

    .timer-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 2;
    }

    .timer-digits {
      font-family: 'JetBrains Mono', monospace;
      font-size: 2.35rem;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -1px;
      text-shadow: 0 0 20px rgba(0, 245, 212, 0.35);
    }

    .timer-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .instrucao-box {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 16px;
      padding: 14px 16px;
    }

    .instrucao-box strong {
      display: block;
      font-size: 0.9rem;
      color: #fff;
      margin-bottom: 4px;
    }

    .instrucao-box span {
      font-size: 0.8rem;
      color: var(--text-muted);
      line-height: 1.45;
      display: block;
    }

    /* ECRÃ PRETO DE AVISO + PAGAMENTO (APARECE SÓ QUANDO QUEBRA A ORDEM) */
    #tela-aviso {
      display: none;
      width: 100%;
      min-height: 100vh;
      background-color: #000000;
      padding: 28px 20px;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      animation: fadeIn 0.25s ease;
    }

    .aviso-container {
      width: 100%;
      max-width: 400px;
    }

    .icon-badge-alert {
      width: 68px;
      height: 68px;
      border-radius: 20px;
      background: rgba(255, 42, 95, 0.12);
      border: 1px solid rgba(255, 42, 95, 0.4);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 2.2rem;
      margin: 0 auto 14px;
      box-shadow: 0 0 25px rgba(255, 42, 95, 0.25);
    }

    .aviso-titulo {
      color: var(--red);
      font-size: 1.45rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    .aviso-sub {
      color: #a1a1aa;
      font-size: 0.88rem;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    .painel-pagamento {
      background: #09090b;
      border: 1px solid rgba(255, 42, 95, 0.45);
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 16px;
      text-align: left;
    }

    .painel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #1f1f23;
      padding-bottom: 12px;
      margin-bottom: 14px;
    }

    .painel-header span {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #a1a1aa;
      font-weight: 700;
    }

    .valor-pill {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--gold);
    }

    .iban-box {
      background: #121215;
      border: 1px solid #27272a;
      border-radius: 10px;
      padding: 12px;
      margin-top: 6px;
    }

    .iban-box small {
      display: block;
      font-size: 0.7rem;
      color: #71717a;
      margin-bottom: 4px;
      letter-spacing: 0.5px;
    }

    .iban-box strong {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.82rem;
      color: var(--cyan);
      word-break: break-all;
    }

    .btn-copy {
      width: 100%;
      margin-top: 10px;
      padding: 11px;
      background: rgba(0, 245, 212, 0.1);
      border: 1px solid rgba(0, 245, 212, 0.35);
      color: var(--cyan);
      border-radius: 10px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-copy:active { transform: scale(0.98); }

    input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid #27272a;
      background: #121215;
      color: #fff;
      font-size: 0.88rem;
      margin-top: 10px;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus { border-color: var(--gold); }

    .btn-primary {
      width: 100%;
      padding: 16px;
      border-radius: 14px;
      font-weight: 800;
      font-size: 0.92rem;
      cursor: pointer;
      border: none;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      background: linear-gradient(135deg, #ffd166, #f77f00);
      color: #000000;
      box-shadow: 0 10px 25px -5px rgba(255, 209, 102, 0.4);
      margin-bottom: 12px;
      transition: transform 0.15s ease;
    }

    .btn-primary:active { transform: scale(0.98); }

    .btn-ghost {
      width: 100%;
      padding: 12px;
      background: transparent;
      border: 1px solid #27272a;
      color: #71717a;
      border-radius: 12px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }

    /* ECRÃ DE VITÓRIA (SEM PAGAMENTO) */
    #tela-vitoria {
      display: none;
    }
  </style>
</head>
<body>

  <!-- 1. ECRÃ PRINCIPAL DO JOGO -->
  <div class="glass-card" id="tela-jogo">
    <div class="premio-pill">🏆 PRÉMIO EM JOGO: 5.000,00 KZ</div>
    
    <div class="status-bar" id="status-bar">
      <div class="dot-live" id="dot-live"></div>
      <span id="status-texto">A CALIBRAR SENSOR (3S)...</span>
    </div>

    <div class="ring-wrapper">
      <svg class="ring-svg" viewBox="0 0 240 240">
        <defs>
          <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#00f5d4" />
            <stop offset="100%" stop-color="#00bbf9" />
          </linearGradient>
        </defs>
        <circle class="ring-bg" cx="120" cy="120" r="108"></circle>
        <circle class="ring-progress" id="ring-progress" cx="120" cy="120" r="108"></circle>
      </svg>
      <div class="timer-center">
        <div class="timer-digits" id="cronometro">06:00:00</div>
        <div class="timer-label">TEMPO RESTANTE</div>
      </div>
    </div>

    <div class="instrucao-box">
      <strong>Não toques nem saias do ecrã</strong>
      <span>Mantém o telemóvel imóvel até o círculo completar 6 horas para ganhar os 5.000 Kz.</span>
    </div>
  </div>

  <!-- 2. ECRÃ DE VITÓRIA (APARECE SE CUMPRIR AS 6H) -->
  <div class="glass-card" id="tela-vitoria">
